<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Certificates | LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar:#2c5c4f; --sidebar-hover:#3a7060; --sidebar-active-text:#2c5c4f;
    --accent-1:#3a7060; --accent-2:#6fae95; --bg:#f3f1ec; --card:#ffffff;
    --text-dark:#1f342e; --text-muted:#6b7a75; --border:#e6e3db;
    --danger:#c0564a; --warn:#c99a3d; --ok:#3a7060; --gold:#c99a3d;
    --radius-lg:18px; --radius-md:12px; --shadow:0 4px 18px rgba(31,52,46,0.06);
    --font-heading:'Poppins',sans-serif; --font-body:'Inter',sans-serif; --font-ur:'Noto Nastaliq Urdu',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text-dark);display:flex;min-height:100vh;}
  html[dir="rtl"] body{font-family:var(--font-ur);}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .brand-name{font-family:var(--font-ur);}
  a{text-decoration:none;color:inherit;} button{font-family:inherit;cursor:pointer;border:none;}
  .app{display:flex;width:100%;min-height:100vh;}
  .sidebar{width:260px;background:var(--sidebar);color:#eaf3ef;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;transition:transform .25s ease;z-index:40;}
  .brand{display:flex;align-items:center;gap:10px;padding:22px 22px 20px;font-family:var(--font-heading);font-weight:700;font-size:1.25rem;}
  .cap-icon{flex-shrink:0;}
  .nav{list-style:none;padding:6px 14px;display:flex;flex-direction:column;gap:4px;}
  .nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-size:.95rem;color:#dcece5;font-weight:500;transition:background .15s,color .15s;}
  .nav a svg{width:18px;height:18px;flex-shrink:0;}
  .nav a:hover{background:var(--sidebar-hover);}
  .nav a.active{background:#fff;color:var(--sidebar-active-text);font-weight:600;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--bg);position:sticky;top:0;z-index:30;gap:16px;flex-wrap:wrap;}
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .hamburger{width:40px;height:40px;border-radius:10px;background:#e3e9e5;display:flex;align-items:center;justify-content:center;color:var(--sidebar);}
  .hamburger svg{width:18px;height:18px;}
  .page-title{font-family:var(--font-heading);font-weight:700;font-size:1.4rem;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .lang-toggle{display:flex;background:#e3e9e5;border-radius:20px;padding:4px;gap:2px;}
  .lang-toggle button{padding:6px 16px;border-radius:16px;font-size:.8rem;font-weight:700;background:transparent;color:var(--text-dark);}
  .lang-toggle button.active{background:var(--sidebar);color:#fff;}
  .bell{position:relative;width:40px;height:40px;border-radius:50%;background:#e3e9e5;display:flex;align-items:center;justify-content:center;color:var(--text-dark);}
  .bell svg{width:18px;height:18px;}
  .bell .dot{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .user-tag{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--text-dark);white-space:nowrap;}
  .user-tag svg{width:20px;height:20px;color:var(--accent-1);flex-shrink:0;}

  .content{padding:4px 32px 40px;}
  .toolbar{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px;}
  .search-box{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:10px;padding:10px 14px;flex:1;min-width:220px;max-width:340px;}
  .search-box svg{width:16px;height:16px;color:var(--text-muted);flex-shrink:0;}
  .search-box input{border:none;background:transparent;outline:none;width:100%;font-size:.88rem;color:var(--text-dark);font-family:inherit;}
  .sort-select{padding:9px 14px;border-radius:10px;background:var(--bg);border:none;font-size:.83rem;font-weight:600;color:var(--text-dark);font-family:inherit;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(320px,1fr));gap:22px;}
  .cert-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;}
  .cert-visual{
    background: repeating-linear-gradient(135deg, var(--sidebar), var(--sidebar) 14px, var(--accent-1) 14px, var(--accent-1) 28px);
    height:110px; position:relative; display:flex; align-items:center; justify-content:center;
  }
  .cert-visual::before{content:"";position:absolute;inset:8px;border:2px solid rgba(255,255,255,.55);border-radius:8px;}
  .cert-seal{width:56px;height:56px;border-radius:50%;background:var(--gold);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.5rem;box-shadow:0 6px 14px rgba(0,0,0,.2); z-index:1;}
  .cert-body{padding:18px 20px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .cert-title{font-family:var(--font-heading);font-weight:600;font-size:1.02rem;}
  .cert-meta{display:flex;flex-direction:column;gap:4px;font-size:.78rem;color:var(--text-muted);}
  .cert-meta b{color:var(--text-dark);}
  .cert-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
  .btn{padding:9px 16px;border-radius:10px;font-size:.8rem;font-weight:700;display:inline-flex;align-items:center;gap:6px;}
  .btn svg{width:14px;height:14px;}
  .btn-primary{background:var(--sidebar);color:#fff;flex:1;justify-content:center;}
  .btn-primary:hover{background:var(--accent-1);}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-dark);}

  .overlay{display:none;}
  @media (max-width:960px){
    .sidebar{position:fixed;left:0;transform:translateX(-100%);}
    html[dir="rtl"] .sidebar{left:auto;right:0;transform:translateX(100%);}
    .sidebar.open{transform:translateX(0);}
    .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
    .topbar{padding:16px 18px;} .content{padding:4px 18px 32px;}
    .page-title{font-size:1.15rem;}
  }
  @media (max-width:560px){ .toolbar{flex-direction:column;align-items:stretch;} .search-box{max-width:none;} }
  :focus-visible{outline:2px solid var(--accent-1);outline-offset:2px;}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><svg class="cap-icon" viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 4L2 11l14 7 11.2-5.6V19h2v-8L16 4z" fill="#f4c430"/>
      <path d="M7 15.5v5c0 1.8 4 4 9 4s9-2.2 9-4v-5L16 20 7 15.5z" fill="#f4c430"/>
      <circle cx="27.2" cy="12.4" r="1.6" fill="#c99a2e"/>
    </svg><span class="brand-name" data-i18n="brand">LMS</span></div>
    <ul class="nav">
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg><span data-i18n="nav_dashboard_t">Dashboard</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="nav_courses">My Courses</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z"/></svg><span data-i18n="nav_learning">Learning</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M5 4h14v16l-7-4-7 4V4z"/></svg><span data-i18n="nav_assessments">Assessments</span></a></li>
      <li><a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M8 13l-2 8 6-3 6 3-2-8"/></svg><span data-i18n="nav_certificates">Certificates</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 6.6L21 9l-5 4.4L17.4 21 12 17.2 6.6 21 8 13.4 3 9l6.6-.4L12 2z"/></svg><span data-i18n="nav_badges">Badges</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg><span data-i18n="nav_profile">Profile</span></a></li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="menuBtn" aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <h1 class="page-title" data-i18n="page_title">Certificates</h1>
      </div>
      <div class="topbar-right">
        <div class="lang-toggle"><button id="btnEn" class="active">EN</button><button id="btnUr">اردو</button></div>
        <div class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot">3</span></div>
        <div class="user-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
          <span data-i18n="user_name">Employee Name</span>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
          <input type="text" id="searchInput" data-i18n-ph="search_ph" placeholder="Search certificates...">
        </div>
        <select class="sort-select" id="sortSelect">
          <option value="recent" data-i18n="sort_recent">Most Recent</option>
          <option value="az" data-i18n="sort_az">Name A–Z</option>
        </select>
      </div>

      <div class="grid" id="certGrid"></div>
    </main>
  </div>
</div>

<script>
const certs = [
  { id:1, code:'CSB-2026-0142', date:'12 Mar 2026',
    title:{en:'Cyber Security Basics', ur:'سائبر سیکیورٹی کی بنیادی باتیں'} },
  { id:2, code:'CCS-2026-0219', date:'2 Apr 2026',
    title:{en:'Communication Skills', ur:'مواصلات کی مہارتیں'} },
  { id:3, code:'DPC-2026-0305', date:'10 May 2026',
    title:{en:'Data Privacy Compliance', ur:'ڈیٹا پرائیویسی کی تعمیل'} },
  { id:4, code:'WPC-2026-0388', date:'22 May 2026',
    title:{en:'Workplace Compliance 101', ur:'دفتری تعمیل کا تعارف'} },
  { id:5, code:'HTC-2026-0410', date:'30 May 2026',
    title:{en:'HTML & CSS Fundamentals', ur:'ایچ ٹی ایم ایل اور سی ایس ایس کی بنیادیں'} },
  { id:6, code:'JSE-2026-0455', date:'15 Jun 2026',
    title:{en:'JavaScript Essentials', ur:'جاوا اسکرپٹ کے بنیادی اصول'} },
];

const i18n = {
  en:{
    brand:'LMS', nav_dashboard_t:'Dashboard', nav_courses:'My Courses', nav_learning:'Learning',
    nav_assessments:'Assessments', nav_certificates:'Certificates', nav_badges:'Badges', nav_profile:'Profile',
    page_title:'Certificates', user_name:'Empoyee Name', search_ph:'Search certificates...', sort_recent:'Most Recent', sort_az:'Name A–Z',
    issued:'Issued on', credential:'Credential ID', btn_view:'View', btn_download:'Download', btn_share:'Share', empty:'No certificates match your search.'
  },
  ur:{
    brand:'ایل ایم ایس', nav_dashboard_t:'ڈیش بورڈ', nav_courses:'میرے کورسز', nav_learning:'تعلیم',
    nav_assessments:'تشخیص', nav_certificates:'اسناد', nav_badges:'بیجز', nav_profile:'پروفائل',
    page_title:'اسناد', user_name:'ملازم کا نام', search_ph:'اسناد تلاش کریں...', sort_recent:'حالیہ ترین', sort_az:'نام کے مطابق',
    issued:'اجرا کی تاریخ', credential:'اسناد کا نمبر', btn_view:'دیکھیں', btn_download:'ڈاؤن لوڈ', btn_share:'شیئر کریں', empty:'آپ کی تلاش سے کوئی سند مماثل نہیں۔'
  }
};

let currentLang='en', searchTerm='', sortBy='recent';

function applyLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang==='ur'?'ur':'en';
  document.documentElement.dir = lang==='ur'?'rtl':'ltr';
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('btnUr').classList.toggle('active', lang==='ur');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const key = el.getAttribute('data-i18n-ph');
    if(i18n[lang][key]) el.setAttribute('placeholder', i18n[lang][key]);
  });
  render();
}
document.getElementById('btnEn').addEventListener('click', ()=>applyLanguage('en'));
document.getElementById('btnUr').addEventListener('click', ()=>applyLanguage('ur'));

const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
document.getElementById('menuBtn').addEventListener('click', ()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show');});
overlay.addEventListener('click', ()=>{sidebar.classList.remove('open');overlay.classList.remove('show');});

document.getElementById('searchInput').addEventListener('input', e=>{ searchTerm=e.target.value.trim().toLowerCase(); render(); });
document.getElementById('sortSelect').addEventListener('change', e=>{ sortBy=e.target.value; render(); });

function render(){
  const grid = document.getElementById('certGrid');
  let items = certs.filter(c => !searchTerm || c.title.en.toLowerCase().includes(searchTerm) || c.title.ur.includes(searchTerm));
  if(sortBy==='az') items = [...items].sort((a,b)=>a.title[currentLang].localeCompare(b.title[currentLang]));

  if(items.length===0){
    grid.innerHTML = `<p style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px 0;">${i18n[currentLang].empty}</p>`;
    return;
  }

  grid.innerHTML = items.map(c => `
    <div class="cert-card">
      <div class="cert-visual"><div class="cert-seal">🏅</div></div>
      <div class="cert-body">
        <div class="cert-title">${c.title[currentLang]}</div>
        <div class="cert-meta">
          <span>${i18n[currentLang].issued}: <b>${c.date}</b></span>
          <span>${i18n[currentLang].credential}: <b>${c.code}</b></span>
        </div>
        <div class="cert-actions">
          <button class="btn btn-primary">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
            ${i18n[currentLang].btn_download}
          </button>
          <button class="btn btn-outline">${i18n[currentLang].btn_view}</button>
          <button class="btn btn-outline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 3.9M15.4 6.6L8.6 10.5"/></svg>
          </button>
        </div>
      </div>
    </div>
  `).join('');
}

applyLanguage('en');
</script>
</body>
</html>
