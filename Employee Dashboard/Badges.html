<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Badges | LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar:#2c5c4f; --sidebar-hover:#3a7060; --sidebar-active-text:#2c5c4f;
    --accent-1:#3a7060; --accent-2:#6fae95; --bg:#f3f1ec; --card:#ffffff;
    --text-dark:#1f342e; --text-muted:#6b7a75; --border:#e6e3db;
    --danger:#c0564a; --warn:#c99a3d; --ok:#3a7060;
    --radius-lg:18px; --radius-md:12px; --shadow:0 4px 18px rgba(31,52,46,0.06);
    --font-heading:'Poppins',sans-serif; --font-body:'Inter',sans-serif; --font-ur:'Noto Nastaliq Urdu',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text-dark);display:flex;min-height:100vh;}
  html[dir="rtl"] body{font-family:var(--font-ur);}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .brand-name{font-family:var(--font-ur);}
  a{text-decoration:none;color:inherit;} button{font-family:inherit;cursor:pointer;border:none;}
  .app{display:flex;width:100%;min-height:100vh;}
  .sidebar{width:260px;background:var(--sidebar);color:#eaf3ef;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;transition:transform .25s ease;z-index:40;}
  .brand{display:flex;align-items:center;gap:10px;padding:22px 22px 20px;font-family:var(--font-heading);font-weight:700;font-size:1.25rem;}
  .cap-icon{flex-shrink:0;}
  .nav{list-style:none;padding:6px 14px;display:flex;flex-direction:column;gap:4px;}
  .nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-size:.95rem;color:#dcece5;font-weight:500;transition:background .15s,color .15s;}
  .nav a svg{width:18px;height:18px;flex-shrink:0;}
  .nav a:hover{background:var(--sidebar-hover);}
  .nav a.active{background:#fff;color:var(--sidebar-active-text);font-weight:600;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--bg);position:sticky;top:0;z-index:30;gap:16px;flex-wrap:wrap;}
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .hamburger{width:40px;height:40px;border-radius:10px;background:#e3e9e5;display:flex;align-items:center;justify-content:center;color:var(--sidebar);}
  .hamburger svg{width:18px;height:18px;}
  .page-title{font-family:var(--font-heading);font-weight:700;font-size:1.4rem;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .lang-toggle{display:flex;background:#e3e9e5;border-radius:20px;padding:4px;gap:2px;}
  .lang-toggle button{padding:6px 16px;border-radius:16px;font-size:.8rem;font-weight:700;background:transparent;color:var(--text-dark);}
  .lang-toggle button.active{background:var(--sidebar);color:#fff;}
  .bell{position:relative;width:40px;height:40px;border-radius:50%;background:#e3e9e5;display:flex;align-items:center;justify-content:center;color:var(--text-dark);}
  .bell svg{width:18px;height:18px;}
  .bell .dot{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .user-tag{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--text-dark);white-space:nowrap;}
  .user-tag svg{width:20px;height:20px;color:var(--accent-1);flex-shrink:0;}

  .content{padding:4px 32px 40px;}
  .hero{background:linear-gradient(120deg, var(--sidebar), var(--accent-1));border-radius:var(--radius-lg);padding:26px 30px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px;flex-wrap:wrap;}
  .hero h2{font-family:var(--font-heading);font-size:1.4rem;margin-bottom:6px;}
  .hero p{font-size:.88rem;color:#dcf0e6;}
  .hero-stat{text-align:center;}
  .hero-stat .num{font-family:var(--font-heading);font-size:1.9rem;font-weight:700;}
  .hero-stat .label{font-size:.72rem;color:#dcf0e6;}
  .hero-stats{display:flex;gap:26px;}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .chip{padding:8px 16px;border-radius:20px;background:var(--card);font-size:.8rem;font-weight:600;color:var(--text-muted);border:1px solid var(--border);}
  .chip.active{background:var(--accent-1);color:#fff;border-color:var(--accent-1);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(220px,1fr));gap:18px;}
  .badge-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:22px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;position:relative;}
  .badge-card.locked{opacity:.55;}
  .badge-medal{width:78px;height:78px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:2rem;background:radial-gradient(circle at 30% 30%, var(--badge-color2,#8fd6b8), var(--badge-color,var(--accent-1)));color:#fff;box-shadow:0 8px 18px color-mix(in srgb, var(--badge-color,var(--accent-1)) 40%, transparent);}
  .badge-card.locked .badge-medal{background:var(--border); box-shadow:none; color:var(--text-muted);}
  .badge-name{font-family:var(--font-heading);font-weight:600;font-size:.95rem;}
  .badge-desc{font-size:.76rem;color:var(--text-muted);line-height:1.5;}
  .badge-date{font-size:.7rem;color:var(--accent-1);font-weight:700;}
  .badge-progress-wrap{width:100%;display:flex;flex-direction:column;gap:4px;margin-top:2px;}
  .badge-track{height:6px;border-radius:6px;background:var(--bg);overflow:hidden;}
  .badge-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--accent-1),var(--accent-2));}
  .badge-progress-label{font-size:.68rem;color:var(--text-muted);font-weight:600;}
  .lock-tag{position:absolute; top:14px; inset-inline-end:14px; font-size:.9rem;}

  .overlay{display:none;}
  @media (max-width:960px){
    .sidebar{position:fixed;left:0;transform:translateX(-100%);}
    html[dir="rtl"] .sidebar{left:auto;right:0;transform:translateX(100%);}
    .sidebar.open{transform:translateX(0);}
    .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
    .topbar{padding:16px 18px;} .content{padding:4px 18px 32px;}
    .page-title{font-size:1.15rem;}
    .hero{flex-direction:column;align-items:flex-start;}
  }
  @media (max-width:560px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .hero-stats{gap:16px;}
  }
  :focus-visible{outline:2px solid var(--accent-1);outline-offset:2px;}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><svg class="cap-icon" viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 4L2 11l14 7 11.2-5.6V19h2v-8L16 4z" fill="#f4c430"/>
      <path d="M7 15.5v5c0 1.8 4 4 9 4s9-2.2 9-4v-5L16 20 7 15.5z" fill="#f4c430"/>
      <circle cx="27.2" cy="12.4" r="1.6" fill="#c99a2e"/>
    </svg><span class="brand-name" data-i18n="brand">LMS</span></div>
    <ul class="nav">
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg><span data-i18n="nav_dashboard_t">Dashboard</span></a></li>
      <li><a href="my-courses.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="nav_courses">My Courses</span></a></li>
      <li><a href="course-learning.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z"/></svg><span data-i18n="nav_learning">Learning</span></a></li>
      <li><a href="assessments.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M5 4h14v16l-7-4-7 4V4z"/></svg><span data-i18n="nav_assessments">Assessments</span></a></li>
      <li><a href="certificates.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M8 13l-2 8 6-3 6 3-2-8"/></svg><span data-i18n="nav_certificates">Certificates</span></a></li>
      <li><a href="badges.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 6.6L21 9l-5 4.4L17.4 21 12 17.2 6.6 21 8 13.4 3 9l6.6-.4L12 2z"/></svg><span data-i18n="nav_badges">Badges</span></a></li>
      <li><a href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg><span data-i18n="nav_profile">Profile</span></a></li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="menuBtn" aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <h1 class="page-title" data-i18n="page_title">Badges</h1>
      </div>
      <div class="topbar-right">
        <div class="lang-toggle"><button id="btnEn" class="active">EN</button><button id="btnUr">اردو</button></div>
        <div class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot">3</span></div>
        <div class="user-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
          <span data-i18n="user_name">Sara Ahmed</span>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="hero">
        <div>
          <h2 data-i18n="hero_title">Your Achievements</h2>
          <p data-i18n="hero_sub">Keep learning to unlock more badges and showcase your skills.</p>
        </div>
        <div class="hero-stats">
          <div class="hero-stat"><div class="num">6</div><div class="label" data-i18n="earned">Earned</div></div>
          <div class="hero-stat"><div class="num">4</div><div class="label" data-i18n="locked">Locked</div></div>
          <div class="hero-stat"><div class="num">60%</div><div class="label" data-i18n="collection">Collection</div></div>
        </div>
      </div>

      <div class="chips" id="chips">
        <button class="chip active" data-filter="all" data-i18n="chip_all">All Badges</button>
        <button class="chip" data-filter="earned" data-i18n="chip_earned">Earned</button>
        <button class="chip" data-filter="locked" data-i18n="chip_locked">Locked</button>
      </div>

      <div class="grid" id="badgeGrid"></div>
    </main>
  </div>
</div>

<script>
const badges = [
  { emoji:'🛡️', color:'#c0564a', color2:'#e28a7d', status:'earned', date:'12 Mar 2026',
    name:{en:'Security Sentinel', ur:'سیکیورٹی سنٹینل'}, desc:{en:'Completed Cyber Security Basics with a passing score.', ur:'سائبر سیکیورٹی کی بنیادی باتیں کامیابی سے مکمل کیں۔'} },
  { emoji:'💻', color:'#3a7060', color2:'#8fd6b8', status:'earned', date:'2 Apr 2026',
    name:{en:'Code Starter', ur:'کوڈ اسٹارٹر'}, desc:{en:'Finished your first technical course from start to end.', ur:'اپنا پہلا تکنیکی کورس شروع سے آخر تک مکمل کیا۔'} },
  { emoji:'⚡', color:'#c99a3d', color2:'#f0cf82', status:'earned', date:'18 Apr 2026',
    name:{en:'Fast Learner', ur:'تیز سیکھنے والا'}, desc:{en:'Completed 3 courses within a single month.', ur:'ایک ہی مہینے میں 3 کورسز مکمل کیے۔'} },
  { emoji:'🎯', color:'#7a5fb0', color2:'#b6a0e0', status:'earned', date:'30 Apr 2026',
    name:{en:'Perfect Score', ur:'مکمل نمبر'}, desc:{en:'Scored 100% on an assessment.', ur:'کسی تشخیص میں 100% نمبر حاصل کیے۔'} },
  { emoji:'📘', color:'#3a7060', color2:'#8fd6b8', status:'earned', date:'10 May 2026',
    name:{en:'Compliance Champion', ur:'تعمیل کا چیمپئن'}, desc:{en:'Completed all mandatory compliance training.', ur:'تمام لازمی تعمیل تربیت مکمل کی۔'} },
  { emoji:'🗣️', color:'#7a5fb0', color2:'#b6a0e0', status:'earned', date:'22 May 2026',
    name:{en:'Great Communicator', ur:'بہترین ابلاغ کار'}, desc:{en:'Completed all soft-skills communication modules.', ur:'تمام مواصلات کے ماڈیولز مکمل کیے۔'} },
  { emoji:'🔥', color:'#c0564a', color2:'#e28a7d', status:'locked', progress:65,
    name:{en:'Streak Master', ur:'تسلسل کا ماہر'}, desc:{en:'Log in and learn for 14 days in a row.', ur:'مسلسل 14 دن لاگ ان ہو کر سیکھیں۔'} },
  { emoji:'👑', color:'#c99a3d', color2:'#f0cf82', status:'locked', progress:40,
    name:{en:'Top Performer', ur:'بہترین کارکردگی'}, desc:{en:'Rank in the top 10 of the monthly leaderboard.', ur:'ماہانہ لیڈربورڈ کی ٹاپ 10 میں آئیں۔'} },
  { emoji:'🧭', color:'#3a7060', color2:'#8fd6b8', status:'locked', progress:20,
    name:{en:'Explorer', ur:'دریافت کار'}, desc:{en:'Enroll in courses from 5 different categories.', ur:'5 مختلف زمروں سے کورسز میں داخلہ لیں۔'} },
  { emoji:'🏆', color:'#7a5fb0', color2:'#b6a0e0', status:'locked', progress:10,
    name:{en:'LMS Legend', ur:'ایل ایم ایس لیجنڈ'}, desc:{en:'Earn every other badge in the collection.', ur:'مجموعے کے باقی تمام بیجز حاصل کریں۔'} },
];

const i18n = {
  en:{
    brand:'LMS', nav_dashboard_t:'Dashboard', nav_courses:'My Courses', nav_learning:'Learning',
    nav_assessments:'Assessments', nav_certificates:'Certificates', nav_badges:'Badges', nav_profile:'Profile',
    page_title:'Badges', user_name:'Employee Name', hero_title:'Your Achievements', hero_sub:'Keep learning to unlock more badges and showcase your skills.',
    earned:'Earned', locked:'Locked', collection:'Collection',
    chip_all:'All Badges', chip_earned:'Earned', chip_locked:'Locked', progress_label:'Progress'
  },
  ur:{
    brand:'ایل ایم ایس', nav_dashboard_t:'ڈیش بورڈ', nav_courses:'میرے کورسز', nav_learning:'تعلیم',
    nav_assessments:'تشخیص', nav_certificates:'اسناد', nav_badges:'بیجز', nav_profile:'پروفائل',
    page_title:'بیجز', user_name:'ملازم کا نام', hero_title:'آپ کی کامیابیاں', hero_sub:'مزید بیجز حاصل کرنے کے لیے سیکھنا جاری رکھیں۔',
    earned:'حاصل شدہ', locked:'مقفل', collection:'مجموعہ',
    chip_all:'تمام بیجز', chip_earned:'حاصل شدہ', chip_locked:'مقفل', progress_label:'پیش رفت'
  }
};

let currentLang='en', activeFilter='all';

function applyLanguage(lang){
  currentLang = lang;
  localStorage.setItem('lms_lang', lang);
  document.documentElement.lang = lang==='ur'?'ur':'en';
  document.documentElement.dir = lang==='ur'?'rtl':'ltr';
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('btnUr').classList.toggle('active', lang==='ur');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  render();
}
document.getElementById('btnEn').addEventListener('click', ()=>applyLanguage('en'));
document.getElementById('btnUr').addEventListener('click', ()=>applyLanguage('ur'));

const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
document.getElementById('menuBtn').addEventListener('click', ()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show');});
overlay.addEventListener('click', ()=>{sidebar.classList.remove('open');overlay.classList.remove('show');});

document.getElementById('chips').addEventListener('click', e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#chips .chip').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeFilter = btn.dataset.filter;
  render();
});

function render(){
  const grid = document.getElementById('badgeGrid');
  const items = badges.filter(b => activeFilter==='all' || b.status===activeFilter);
  grid.innerHTML = items.map(b => `
    <div class="badge-card ${b.status==='locked'?'locked':''}" style="--badge-color:${b.color};--badge-color2:${b.color2}">
      ${b.status==='locked' ? '<span class="lock-tag">🔒</span>' : ''}
      <div class="badge-medal">${b.emoji}</div>
      <div class="badge-name">${b.name[currentLang]}</div>
      <div class="badge-desc">${b.desc[currentLang]}</div>
      ${b.status==='earned'
        ? `<div class="badge-date">${b.date}</div>`
        : `<div class="badge-progress-wrap">
             <div class="badge-track"><div class="badge-fill" style="width:${b.progress}%"></div></div>
             <div class="badge-progress-label">${i18n[currentLang].progress_label}: ${b.progress}%</div>
           </div>`
      }
    </div>
  `).join('');
}

applyLanguage(localStorage.getItem('lms_lang') || 'en');
</script>
</body>
</html>
