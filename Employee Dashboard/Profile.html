<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile | LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Noto+Nastaliq+Urdu:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sidebar:#2c5c4f; --sidebar-hover:#3a7060; --sidebar-active-text:#2c5c4f;
    --accent-1:#3a7060; --accent-2:#6fae95; --bg:#f3f1ec; --card:#ffffff;
    --text-dark:#1f342e; --text-muted:#6b7a75; --border:#e6e3db;
    --danger:#c0564a; --warn:#c99a3d; --ok:#3a7060;
    --radius-lg:18px; --radius-md:12px; --shadow:0 4px 18px rgba(31,52,46,0.06);
    --font-heading:'Poppins',sans-serif; --font-body:'Inter',sans-serif; --font-ur:'Noto Nastaliq Urdu',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text-dark);display:flex;min-height:100vh;}
  html[dir="rtl"] body{font-family:var(--font-ur);}
  html[dir="rtl"] h1,html[dir="rtl"] h2,html[dir="rtl"] h3,html[dir="rtl"] .brand-name{font-family:var(--font-ur);}
  a{text-decoration:none;color:inherit;} button{font-family:inherit;cursor:pointer;border:none;}
  input, select{font-family:inherit;}
  .app{display:flex;width:100%;min-height:100vh;}
  .sidebar{width:260px;background:var(--sidebar);color:#eaf3ef;display:flex;flex-direction:column;flex-shrink:0;position:sticky;top:0;height:100vh;transition:transform .25s ease;z-index:40;}
  .brand{display:flex;align-items:center;gap:10px;padding:22px 22px 20px;font-family:var(--font-heading);font-weight:700;font-size:1.25rem;}
  .cap-icon{flex-shrink:0;}
  .nav{list-style:none;padding:6px 14px;display:flex;flex-direction:column;gap:4px;}
  .nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:10px;font-size:.95rem;color:#dcece5;font-weight:500;transition:background .15s,color .15s;}
  .nav a svg{width:18px;height:18px;flex-shrink:0;}
  .nav a:hover{background:var(--sidebar-hover);}
  .nav a.active{background:#fff;color:var(--sidebar-active-text);font-weight:600;}
  .main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--bg);position:sticky;top:0;z-index:30;gap:16px;flex-wrap:wrap;}
  .topbar-left{display:flex;align-items:center;gap:14px;}
  .hamburger{width:40px;height:40px;border-radius:10px;background:#e3e9e5;display:flex;align-items:center;justify-content:center;color:var(--sidebar);}
  .hamburger svg{width:18px;height:18px;}
  .page-title{font-family:var(--font-heading);font-weight:700;font-size:1.4rem;}
  .topbar-right{display:flex;align-items:center;gap:14px;}
  .lang-toggle{display:flex;background:#e3e9e5;border-radius:20px;padding:4px;gap:2px;}
  .lang-toggle button{padding:6px 16px;border-radius:16px;font-size:.8rem;font-weight:700;background:transparent;color:var(--text-dark);}
  .lang-toggle button.active{background:var(--sidebar);color:#fff;}
  .bell{position:relative;width:40px;height:40px;border-radius:50%;background:#e3e9e5;display:flex;align-items:center;justify-content:center;color:var(--text-dark);}
  .bell svg{width:18px;height:18px;}
  .bell .dot{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:700;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .user-tag{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:700;color:var(--text-dark);white-space:nowrap;}
  .user-tag svg{width:20px;height:20px;color:var(--accent-1);flex-shrink:0;}

  .content{padding:4px 32px 40px;}
  .profile-hero{background:linear-gradient(120deg, var(--sidebar), var(--accent-1));border-radius:var(--radius-lg);padding:28px 30px;color:#fff;display:flex;align-items:center;gap:20px;margin-bottom:22px;flex-wrap:wrap;}
  .avatar-lg{width:84px;height:84px;border-radius:50%;background:#fff;color:var(--sidebar);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:1.8rem;font-family:var(--font-heading);flex-shrink:0;}
  .avatar-lg svg{width:40px;height:40px;}
  .profile-hero h2{font-family:var(--font-heading);font-size:1.4rem;margin-bottom:4px;}
  .profile-hero p{font-size:.85rem;color:#dcf0e6;}
  .hero-tags{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;}
  .hero-tag{font-size:.72rem;font-weight:700;background:rgba(255,255,255,.18);padding:5px 12px;border-radius:20px;}

  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px;}
  .stat-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:18px;text-align:center;}
  .stat-num{font-family:var(--font-heading);font-size:1.5rem;font-weight:700;color:var(--sidebar);}
  .stat-label{font-size:.78rem;color:var(--text-muted);font-weight:500;}

  .tabs-card{background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden;}
  .tabs-head{display:flex;border-bottom:1px solid var(--border);overflow-x:auto;}
  .tabs-head button{padding:14px 20px;font-size:.85rem;font-weight:600;color:var(--text-muted);border-bottom:3px solid transparent;white-space:nowrap;}
  .tabs-head button.active{color:var(--sidebar);border-color:var(--sidebar);}
  .tabs-body{padding:24px;}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1/-1;}
  .field label{font-size:.8rem;font-weight:600;color:var(--text-dark);}
  .field input, .field select{padding:11px 14px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);font-size:.88rem;color:var(--text-dark);outline:none;}
  .field input:focus, .field select:focus{border-color:var(--accent-1);}
  .field input:disabled{color:var(--text-muted);}

  .form-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:22px;}
  .btn{padding:11px 22px;border-radius:10px;font-size:.85rem;font-weight:700;}
  .btn-primary{background:var(--sidebar);color:#fff;}
  .btn-primary:hover{background:var(--accent-1);}
  .btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text-dark);}

  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
  .toggle-row:last-child{border-bottom:none;}
  .toggle-row .t-title{font-size:.9rem;font-weight:600;}
  .toggle-row .t-sub{font-size:.78rem;color:var(--text-muted);}
  .switch{position:relative;width:44px;height:24px;background:var(--border);border-radius:20px;cursor:pointer;flex-shrink:0;}
  .switch.on{background:var(--accent-1);}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .15s ease;}
  html[dir="rtl"] .switch::after{left:auto;right:3px;}
  .switch.on::after{transform:translateX(20px);}
  html[dir="rtl"] .switch.on::after{transform:translateX(-20px);}

  .overlay{display:none;}
  @media (max-width:960px){
    .sidebar{position:fixed;left:0;transform:translateX(-100%);}
    html[dir="rtl"] .sidebar{left:auto;right:0;transform:translateX(100%);}
    .sidebar.open{transform:translateX(0);}
    .overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35;}
    .topbar{padding:16px 18px;} .content{padding:4px 18px 32px;}
    .page-title{font-size:1.15rem;}
    .stats-row{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:640px){ .form-grid{grid-template-columns:1fr;} .profile-hero{flex-direction:column;text-align:center;} }
  :focus-visible{outline:2px solid var(--accent-1);outline-offset:2px;}
</style>
</head>
<body>
<div class="overlay" id="overlay"></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><svg class="cap-icon" viewBox="0 0 32 32" width="28" height="28" xmlns="http://www.w3.org/2000/svg">
      <path d="M16 4L2 11l14 7 11.2-5.6V19h2v-8L16 4z" fill="#f4c430"/>
      <path d="M7 15.5v5c0 1.8 4 4 9 4s9-2.2 9-4v-5L16 20 7 15.5z" fill="#f4c430"/>
      <circle cx="27.2" cy="12.4" r="1.6" fill="#c99a2e"/>
    </svg><span class="brand-name" data-i18n="brand">LMS</span></div>
    <ul class="nav">
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg><span data-i18n="nav_dashboard_t">Dashboard</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span data-i18n="nav_courses">My Courses</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4V8z"/></svg><span data-i18n="nav_learning">Learning</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4M5 4h14v16l-7-4-7 4V4z"/></svg><span data-i18n="nav_assessments">Assessments</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="5"/><path d="M8 13l-2 8 6-3 6 3-2-8"/></svg><span data-i18n="nav_certificates">Certificates</span></a></li>
      <li><a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l2.4 6.6L21 9l-5 4.4L17.4 21 12 17.2 6.6 21 8 13.4 3 9l6.6-.4L12 2z"/></svg><span data-i18n="nav_badges">Badges</span></a></li>
      <li><a href="#" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg><span data-i18n="nav_profile">Profile</span></a></li>
    </ul>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="menuBtn" aria-label="Toggle menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
        <h1 class="page-title" data-i18n="page_title">Profile</h1>
      </div>
      <div class="topbar-right">
        <div class="lang-toggle"><button id="btnEn" class="active">EN</button><button id="btnUr">اردو</button></div>
        <div class="bell"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg><span class="dot">3</span></div>
        <div class="user-tag">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
          <span data-i18n="user_name">Employee Name</span>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="profile-hero">
        <div class="avatar-lg">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
        </div>
        <div>
          <h2 data-i18n="user_name">Employee Name</h2>
          <p data-i18n="user_role_dept">Employee · Human Resources Department</p>
          <div class="hero-tags">
            <span class="hero-tag" data-i18n="tag_id">ID: EMP-2291</span>
            <span class="hero-tag" data-i18n="tag_join">Joined Jan 2025</span>
          </div>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-card"><div class="stat-num">08</div><div class="stat-label" data-i18n="stat_enrolled">Enrolled Courses</div></div>
        <div class="stat-card"><div class="stat-num">05</div><div class="stat-label" data-i18n="stat_completed">Completed</div></div>
        <div class="stat-card"><div class="stat-num">06</div><div class="stat-label" data-i18n="stat_certs">Certificates</div></div>
        <div class="stat-card"><div class="stat-num">06</div><div class="stat-label" data-i18n="stat_badges">Badges Earned</div></div>
      </div>

      <div class="tabs-card">
        <div class="tabs-head" id="tabHead">
          <button class="active" data-tab="personal" data-i18n="tab_personal">Personal Info</button>
          <button data-tab="security" data-i18n="tab_security">Security</button>
          <button data-tab="notifications" data-i18n="tab_notifications">Notifications</button>
        </div>
        <div class="tabs-body" id="tabBody"></div>
      </div>
    </main>
  </div>
</div>

<script>
const i18n = {
  en:{
    brand:'LMS', nav_dashboard_t:'Dashboard', nav_courses:'My Courses', nav_learning:'Learning',
    nav_assessments:'Assessments', nav_certificates:'Certificates', nav_badges:'Badges', nav_profile:'Profile',
    page_title:'Profile', user_name:'Employee Name', user_role_dept:'Employee · Human Resources Department',
    tag_id:'ID: EMP-2291', tag_join:'Joined Jan 2025',
    stat_enrolled:'Enrolled Courses', stat_completed:'Completed', stat_certs:'Certificates', stat_badges:'Badges Earned',
    tab_personal:'Personal Info', tab_security:'Security', tab_notifications:'Notifications',
    f_first:'First Name', f_last:'Last Name', f_email:'Email Address', f_phone:'Phone Number',
    f_dept:'Department', f_designation:'Designation', f_manager:'Reporting Manager', f_lang:'Preferred Language',
    save:'Save Changes', cancel:'Cancel',
    f_current:'Current Password', f_new:'New Password', f_confirm:'Confirm New Password', update_pw:'Update Password',
    n_course:'Course Updates', n_course_sub:'Get notified about new lessons and course changes.',
    n_assess:'Assessment Reminders', n_assess_sub:'Reminders before assessment deadlines.',
    n_cert:'Certificate Alerts', n_cert_sub:'Notify me when a new certificate is issued.',
    n_news:'Newsletter', n_news_sub:'Occasional updates about new courses and features.'
  },
  ur:{
    brand:'ایل ایم ایس', nav_dashboard_t:'ڈیش بورڈ', nav_courses:'میرے کورسز', nav_learning:'تعلیم',
    nav_assessments:'تشخیص', nav_certificates:'اسناد', nav_badges:'بیجز', nav_profile:'پروفائل',
    page_title:'پروفائل', user_name:'ملازم کا نام', user_role_dept:'ملازم · انسانی وسائل کا شعبہ',
    tag_id:'شناختی نمبر: EMP-2291', tag_join:'شمولیت جنوری 2025',
    stat_enrolled:'داخلہ شدہ کورسز', stat_completed:'مکمل شدہ', stat_certs:'اسناد', stat_badges:'حاصل شدہ بیجز',
    tab_personal:'ذاتی معلومات', tab_security:'حفاظت', tab_notifications:'اطلاعات',
    f_first:'پہلا نام', f_last:'آخری نام', f_email:'ای میل ایڈریس', f_phone:'فون نمبر',
    f_dept:'شعبہ', f_designation:'عہدہ', f_manager:'رپورٹنگ مینیجر', f_lang:'ترجیحی زبان',
    save:'تبدیلیاں محفوظ کریں', cancel:'منسوخ کریں',
    f_current:'موجودہ پاس ورڈ', f_new:'نیا پاس ورڈ', f_confirm:'نئے پاس ورڈ کی تصدیق', update_pw:'پاس ورڈ اپ ڈیٹ کریں',
    n_course:'کورس اپڈیٹس', n_course_sub:'نئے اسباق اور کورس تبدیلیوں کی اطلاع حاصل کریں۔',
    n_assess:'تشخیص کی یاد دہانیاں', n_assess_sub:'تشخیص کی آخری تاریخ سے پہلے یاد دہانی۔',
    n_cert:'سند کی اطلاعات', n_cert_sub:'نئی سند جاری ہونے پر مطلع کریں۔',
    n_news:'نیوز لیٹر', n_news_sub:'نئے کورسز اور خصوصیات کے بارے میں گاہے بگاہے اپڈیٹس۔'
  }
};

let currentLang='en', activeTab='personal';
const toggleState = { course:true, assess:true, cert:true, news:false };

function t(k){ return i18n[currentLang][k] || k; }

function applyLanguage(lang){
  currentLang = lang;
  document.documentElement.lang = lang==='ur'?'ur':'en';
  document.documentElement.dir = lang==='ur'?'rtl':'ltr';
  document.getElementById('btnEn').classList.toggle('active', lang==='en');
  document.getElementById('btnUr').classList.toggle('active', lang==='ur');
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const key = el.getAttribute('data-i18n');
    if(i18n[lang][key]) el.textContent = i18n[lang][key];
  });
  renderTab();
}
document.getElementById('btnEn').addEventListener('click', ()=>applyLanguage('en'));
document.getElementById('btnUr').addEventListener('click', ()=>applyLanguage('ur'));

const sidebar=document.getElementById('sidebar'), overlay=document.getElementById('overlay');
document.getElementById('menuBtn').addEventListener('click', ()=>{sidebar.classList.toggle('open');overlay.classList.toggle('show');});
overlay.addEventListener('click', ()=>{sidebar.classList.remove('open');overlay.classList.remove('show');});

document.getElementById('tabHead').addEventListener('click', e=>{
  const btn=e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#tabHead button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  activeTab = btn.dataset.tab;
  renderTab();
});

function renderTab(){
  const body = document.getElementById('tabBody');
  if(activeTab==='personal'){
    body.innerHTML = `
      <div class="form-grid">
        <div class="field"><label>${t('f_first')}</label><input type="text" value="Sara"></div>
        <div class="field"><label>${t('f_last')}</label><input type="text" value="Ahmed"></div>
        <div class="field"><label>${t('f_email')}</label><input type="email" value="sara.ahmed@company.com" disabled></div>
        <div class="field"><label>${t('f_phone')}</label><input type="tel" value="+92 300 1234567"></div>
        <div class="field"><label>${t('f_dept')}</label><input type="text" value="Human Resources" disabled></div>
        <div class="field"><label>${t('f_designation')}</label><input type="text" value="HR Executive" disabled></div>
        <div class="field"><label>${t('f_manager')}</label><input type="text" value="Ali Raza" disabled></div>
        <div class="field">
          <label>${t('f_lang')}</label>
          <select id="langPref">
            <option value="en" ${currentLang==='en'?'selected':''}>English</option>
            <option value="ur" ${currentLang==='ur'?'selected':''}>اردو</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-outline">${t('cancel')}</button>
        <button class="btn btn-primary">${t('save')}</button>
      </div>`;
    document.getElementById('langPref').addEventListener('change', e=> applyLanguage(e.target.value));
  } else if(activeTab==='security'){
    body.innerHTML = `
      <div class="form-grid">
        <div class="field full"><label>${t('f_current')}</label><input type="password" placeholder="••••••••"></div>
        <div class="field"><label>${t('f_new')}</label><input type="password" placeholder="••••••••"></div>
        <div class="field"><label>${t('f_confirm')}</label><input type="password" placeholder="••••••••"></div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary">${t('update_pw')}</button>
      </div>`;
  } else {
    const items = [
      {key:'course', title:t('n_course'), sub:t('n_course_sub')},
      {key:'assess', title:t('n_assess'), sub:t('n_assess_sub')},
      {key:'cert', title:t('n_cert'), sub:t('n_cert_sub')},
      {key:'news', title:t('n_news'), sub:t('n_news_sub')},
    ];
    body.innerHTML = items.map(it => `
      <div class="toggle-row">
        <div><div class="t-title">${it.title}</div><div class="t-sub">${it.sub}</div></div>
        <div class="switch ${toggleState[it.key]?'on':''}" data-key="${it.key}"></div>
      </div>`).join('');
    body.querySelectorAll('.switch').forEach(sw => {
      sw.addEventListener('click', () => {
        const key = sw.dataset.key;
        toggleState[key] = !toggleState[key];
        sw.classList.toggle('on', toggleState[key]);
      });
    });
  }
}

applyLanguage('en');
</script>
</body>
</html>
