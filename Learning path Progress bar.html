<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Learning Paths Preview</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #f3f4f6;
    margin: 0;
    padding: 32px;
    color: #111827;
  }
  .wrap { max-width: 1024px; margin: 0 auto; }
  .notice {
    background: #eef2ff;
    border: 1px solid #c7d2fe;
    color: #3730a3;
    font-size: 13px;
    border-radius: 10px;
    padding: 12px 16px;
    margin-bottom: 20px;
    line-height: 1.5;
  }
  .notice code { background: #e0e7ff; padding: 1px 5px; border-radius: 4px; font-size: 12px; }

  h1 { font-size: 28px; font-weight: 700; margin: 0 0 6px; color: #111827; }
  .subtitle { color: #6b7280; font-size: 16px; margin: 0 0 28px; }

  .path-card {
    background: #fff;
    border-radius: 16px;
    border: 1px solid #e5e7eb;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    overflow: hidden;
    display: flex;
    margin-bottom: 24px;
  }
  @media (max-width: 768px) {
    .path-card { flex-direction: column; }
  }

  .path-left {
    width: 34%;
    background: #f9fafb;
    border-right: 1px solid #f3f4f6;
    padding: 28px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  @media (max-width: 768px) {
    .path-left { width: 100%; border-right: none; border-bottom: 1px solid #f3f4f6; }
  }

  .path-title { font-size: 22px; font-weight: 700; margin: 0 0 8px; color: #111827; }
  .path-desc { color: #4b5563; margin: 0 0 20px; font-size: 14px; line-height: 1.5; }

  .progress-wrap { margin-top: 8px; }
  .progress-top { display: flex; justify-content: space-between; margin-bottom: 6px; }
  .progress-label { font-size: 11px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.03em; }
  .progress-pct { font-size: 12px; font-weight: 700; color: #374151; }
  .progress-track { width: 100%; height: 10px; border-radius: 999px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 999px; transition: width 0.5s ease; }

  .courses-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 700;
    color: #4338ca;
    background: #eef2ff;
    padding: 6px 14px;
    border-radius: 999px;
    width: fit-content;
    margin-top: 18px;
  }

  .path-right { width: 66%; padding: 24px; }
  @media (max-width: 768px) {
    .path-right { width: 100%; }
  }
  .timeline { position: relative; }
  .timeline-line {
    position: absolute;
    left: 24px;
    top: 32px;
    bottom: 32px;
    width: 2px;
    background: #e5e7eb;
  }
  .step { position: relative; display: flex; gap: 16px; margin-bottom: 20px; }
  .step:last-child { margin-bottom: 0; }
  .step-num {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: #fff;
    border: 2px solid #4338ca;
    display: flex; align-items: center; justify-content: center;
    color: #4338ca; font-weight: 700; font-size: 15px;
    z-index: 1; flex-shrink: 0;
  }
  .step-card {
    background: #f9fafb;
    border-radius: 12px;
    padding: 16px;
    border: 1px solid #f3f4f6;
    flex: 1;
  }
  .step-title { font-weight: 700; color: #111827; margin: 0 0 4px; font-size: 15px; }
  .step-desc { color: #6b7280; font-size: 13px; margin: 0; }
  .step-meta { display: flex; gap: 16px; margin-top: 10px; font-size: 12px; font-weight: 600; color: #9ca3af; }
</style>
</head>
<body>
<div class="wrap">

  <h1>Learning Paths</h1>
  <p class="subtitle">Curated journeys designed to build mastery in specific domains.</p>

  <div id="paths"></div>
</div>

<script>
const mockPaths = [
  {
    id: 1,
    title: "Frontend Fundamentals",
    description: "Curated journey through HTML, CSS and JavaScript basics.",
    courses: [
      { completed: true,  course: { title: "HTML Essentials", description: "Structure and semantics of the web.", _count: { modules: 8 }, timeLimitMins: 45 } },
      { completed: true,  course: { title: "CSS Layout & Styling", description: "Flexbox, grid, and responsive design.", _count: { modules: 10 }, timeLimitMins: 60 } },
      { completed: false, course: { title: "JavaScript Basics", description: "Variables, functions, and DOM manipulation.", _count: { modules: 12 }, timeLimitMins: 90 } },
      { completed: false, course: { title: "Modern JS (ES6+)", description: "Arrow functions, promises, modules.", _count: { modules: 9 }, timeLimitMins: 75 } },
      { completed: false, course: { title: "React Foundations", description: "Components, props, and state.", _count: { modules: 14 }, timeLimitMins: 120 } },
    ],
  },
  {
    id: 2,
    title: "Data Structures Deep Dive",
    description: "From arrays to graphs, with hands-on exercises.",
    courses: [
      { completed: true,  course: { title: "Arrays & Strings", description: "Core operations and complexity.", _count: { modules: 6 }, timeLimitMins: 40 } },
      { completed: false, course: { title: "Linked Lists", description: "Singly and doubly linked structures.", _count: { modules: 5 }, timeLimitMins: 35 } },
      { completed: false, course: { title: "Trees & Graphs", description: "Traversals and shortest paths.", _count: { modules: 11 }, timeLimitMins: 80 } },
    ],
  },
  {
    id: 3,
    title: "Cloud Architecture",
    description: "Design resilient, scalable systems on modern cloud platforms.",
    courses: [
      { completed: true, course: { title: "Cloud Fundamentals", description: "Compute, storage, and networking basics.", _count: { modules: 7 }, timeLimitMins: 50 } },
      { completed: true, course: { title: "Containers & Orchestration", description: "Docker and Kubernetes essentials.", _count: { modules: 9 }, timeLimitMins: 70 } },
      { completed: true, course: { title: "CI/CD Pipelines", description: "Automating build, test, and deploy.", _count: { modules: 6 }, timeLimitMins: 45 } },
    ],
  },
];

function getPathProgress(path) {
  const total = path.courses.length;
  if (total === 0) return 0;
  const completed = path.courses.filter(pc => pc.completed || (pc.course && pc.course.completed)).length;
  return Math.round((completed / total) * 100);
}

function getProgressColor(percent) {
  if (percent < 25) return { bar: "#ef4444", track: "#fee2e2", label: "Just Started" };
  if (percent < 50) return { bar: "#eab308", track: "#fef9c3", label: "In Progress" };
  if (percent < 75) return { bar: "#4ade80", track: "#dcfce7", label: "Almost There" };
  return { bar: "#22c55e", track: "#dcfce7", label: "Complete" };
}

function renderProgressBar(path) {
  const percent = getPathProgress(path);
  const c = getProgressColor(percent);
  return `
    <div class="progress-wrap">
      <div class="progress-top">
        <span class="progress-label">${c.label}</span>
        <span class="progress-pct">${percent}%</span>
      </div>
      <div class="progress-track" style="background:${c.track};">
        <div class="progress-fill" style="width:${percent}%; background:${c.bar};"></div>
      </div>
    </div>`;
}

function renderStep(pc, idx) {
  return `
    <div class="step">
      <div class="step-num">${idx + 1}</div>
      <div class="step-card">
        <h3 class="step-title">${pc.course.title}</h3>
        <p class="step-desc">${pc.course.description}</p>
        <div class="step-meta">
          <span>${pc.course._count?.modules || 0} Modules</span>
          ${pc.course.timeLimitMins ? `<span>• ${pc.course.timeLimitMins} mins</span>` : ""}
        </div>
      </div>
    </div>`;
}

function renderPath(path) {
  return `
    <div class="path-card">
      <div class="path-left">
        <h2 class="path-title">${path.title}</h2>
        <p class="path-desc">${path.description}</p>
        ${renderProgressBar(path)}
        <div class="courses-badge">🗺️ ${path.courses.length} Courses</div>
      </div>
      <div class="path-right">
        <div class="timeline">
          <div class="timeline-line"></div>
          ${path.courses.map(renderStep).join("")}
        </div>
      </div>
    </div>`;
}

document.getElementById("paths").innerHTML = mockPaths.map(renderPath).join("");
</script>
</body>
</html>
